
<!DOCTYPE html>
<html>
<head>
    <title>Quiz Result</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            text-align: center;
            padding: 60px 15px;
        }

        .result {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 35px;
            border-radius: 12px;
        }

        h1 {
            color: #2563eb;
        }

        h2 {
            color: #16a34a;
        }

        a {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="result">

    <h1>Quiz Completed!</h1>

    <h2>Your Score: {{ score }} / {{ total }}</h2>

    <h3>{{ message }}</h3>

    <a href="/">Try Again</a>

</div>

</body>
</html>
